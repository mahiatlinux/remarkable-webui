name: desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'server/**'
      - 'shared/**'
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tools/prepare-desktop.mjs'
      - 'tools/smoke-sidecar.mjs'
      - 'tools/licenses.mjs'
      - 'package*.json'
      - '.github/workflows/desktop.yml'
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
            bundles: deb,appimage
          - os: macos-15
            name: macos-arm64
            bundles: dmg
          - os: macos-15-intel
            name: macos-x64
            bundles: dmg
          - os: windows-latest
            name: windows-x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Build installer
        run: npm run desktop:build -- --bundles ${{ matrix.bundles }}
      - name: Check bundled backend
        run: node tools/smoke-sidecar.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: installers
          merge-multiple: true
      - name: Attach installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          find installers -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.exe' \) -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
